<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curso de Programación Orientada a Objetos con Python. 16 semanas, 3 unidades y 3 proyectos. Videojuegos, interfaces gráficas y aplicaciones reales.">
  <title>POO con Python · Curso completo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" aria-label="Mostrar u ocultar menú" title="Menú">
      <span class="icon-bars" aria-hidden="true"></span>
    </button>
    <button class="icon-btn" id="homeBtn" aria-label="Ir al inicio" title="Inicio" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"></path>
        <path d="M5.5 9.5V21h13V9.5"></path>
      </svg>
    </button>
    <button class="brand" id="brandBtn" aria-label="Ir al inicio">
      <span class="brand-mark">POO</span>
      <span class="brand-name">Python</span>
    </button>
    <div class="path-indicator" id="pathIndicator">Inicio</div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegación del curso">
      <div class="sidebar-head">
        <span class="sidebar-eyebrow">Curso completo</span>
        <span class="sidebar-title">16 semanas · 3 unidades</span>
      </div>
      <nav class="sidebar-tree" id="sidebarTree"></nav>
      <div class="sidebar-foot">
        <span>Python 3.12 · Tkinter</span>
        <span class="sidebar-dot"></span>
        <span>100% práctico</span>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="landing-view" id="landing-view" aria-label="Inicio del curso"></section>

      <section class="content-view" id="markdown-view" aria-label="Documento">
        <div class="content-toolbar">
          <div class="toolbar-left">
            <span class="toolbar-badge" id="mdBadge">Documento</span>
            <h2 class="toolbar-title" id="mdTitle">Cargando…</h2>
          </div>
          <div class="toolbar-actions">
            <button class="ghost-btn" id="mdRawBtn" title="Abrir el archivo original">Ver fuente</button>
          </div>
        </div>
        <article class="markdown-body" id="mdBody"></article>
      </section>

      <section class="content-view slides-view" id="slides-view" aria-label="Presentación">
        <div class="content-toolbar slides-toolbar">
          <div class="toolbar-left">
            <span class="toolbar-badge badge-slides">Slides</span>
            <h2 class="toolbar-title" id="slidesTitle">Presentación</h2>
          </div>
          <div class="toolbar-actions">
            <span class="slide-counter" id="slideCounter">1 / 1</span>
            <button class="ghost-btn" id="slidesFullBtn" title="Abrir presentación en pestaña nueva">Pantalla completa</button>
          </div>
        </div>
        <div class="slides-stage" id="slidesStage"></div>
        <div class="slides-controls" id="slidesControls">
          <button class="slides-nav" id="slidePrev" aria-label="Slide anterior">◀</button>
          <div class="slides-dots" id="slideDots"></div>
          <button class="slides-nav" id="slideNext" aria-label="Slide siguiente">▶</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="data.js"></script>
  <script src="landing.js"></script>
</body>
</html>
